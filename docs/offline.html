<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      つながらないときに出す画面。
      製品名はここに書かない。業務データも置かない。
    -->
    <title>つながりませんでした</title>
    <style>
      body {
        margin: 0;
        font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
        font-size: 16px;
        line-height: 1.8;
        color: #1a1a1a;
        background: #f5f7f6;
      }
      main {
        max-width: 32rem;
        margin: 8vh auto;
        padding: 24px 20px 20px;
        background: #fff;
        border: 1px solid #d0d5d2;
        border-radius: 12px;
      }
      h1 { font-size: 1.3rem; margin: 0 0 12px; }
      ul { margin: 12px 0 0; padding-left: 1.3em; }
      li { margin: 8px 0; }
      button {
        margin-top: 18px;
        width: 100%;
        min-height: 48px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: #1f6f3f;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>つながりませんでした</h1>
      <p>ネットワークにつながっていないか、接続先が応答していません。入力していた内容は送られていません。</p>
      <ul>
        <li>Wi-Fi・携帯の電波が入っているかをご確認ください。</li>
        <li>社内の親機に置いている場合は、社内の Wi-Fi・LAN につないでください。社外からは、会社で用意した VPN につないでください。</li>
        <li>つながったら、下のボタンで開き直してください。</li>
      </ul>
      <button type="button" onclick="location.reload()">開き直す</button>
    </main>
  </body>
</html>
